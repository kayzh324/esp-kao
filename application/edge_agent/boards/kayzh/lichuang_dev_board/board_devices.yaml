version: 1.0.0

# Devices Configuration
devices:
  # boardmanager无法把expander扩展出来的引脚传给屏幕驱动控制，屏幕需要cs跳变另外两个引脚不需要跳变，因此直接将引脚控制直接放入定制屏幕驱动的初始化过程中，不再把扩展芯片注册进boardmanager
