  #       i2c_addr: 0x32              # 8-bit form of 7-bit 0x19 (A0=1, A1=A2=0); board manager probes addr>>1


  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      esp_st7789_lichuang_custom:
        override_path: "${BOARD_PATH}/components/esp_st7789_lichuang_custom"
        require: public
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: true
      invert_color: true             # ST7789 通常需要反色
      need_reset: false
      x_max: 320
      y_max: 240
      io_spi_config:
        cs_gpio_num: -1              # CS 由定制驱动里的 PCA9557 完成 reset 期间的 CS 转换
        dc_gpio_num: 39              # 实战派 IO39 DC ✅
        spi_mode: 0
        pclk_hz: 80000000            # 原厂使用 80 MHz
        trans_queue_depth: 10         # 原厂使用深度 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: -1           # 实战派 LCD 无独立复位脚（或经 expander）
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        vendor_config: NULL
        flags:
          reset_active_high: false
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    version: default
    depends_on: display_lcd
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
      touch_config:
        # The panel's raw touch frame is portrait 240x320. esp_lcd_touch applies
        # mirror as (x_max - x) BEFORE swap_xy, so x_max/y_max are the mirror axes
        # and must match the raw ranges (240/320) -- not the 320x240 display size.
        x_max: 240
        y_max: 320
        rst_gpio_num: -1
        int_gpio_num: -1
        flags:
          swap_xy: true
          mirror_x: true
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0x70]

  - name: fs_sdcard
    version: default
    type: fs_fat
    sub_type: sdmmc
    config:
      mount_point: /sdcard
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_1
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 1
        slot_flags: SDMMC_SLOT_FLAG_INTERNAL_PULLUP
        pins:
          clk: 47
          cmd: 48
          d0: 21
          d1: -1
          d2: -1
          d3: -1
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
    peripherals: []

  # Onboard QMI8658A 6-axis IMU (I2C 0x6a), read through the lua_module_imu
  # QMI8658 backend: local imu = require("imu"); imu.new("imu_sensor").
  - name: imu_sensor
    chip: qmi8658
    type: custom
    version: 1.0.0
    init_skip: true
    config:
      i2c_addr: 0x6a
      frequency: 400000
      int_gpio_num: -1
      sdo_gpio_num: -1
    peripherals:
      - name: i2c_master

  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      # DAC channel mask, 1-enable, 0-disable, layout: left,right
      dac_channel_mask: "1"     # Left enable
      dac_init_gain: 0           # dB

      # Audio processing settings
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30              # 实战派 ES8311 地址 ✅
        frequency: 400000

