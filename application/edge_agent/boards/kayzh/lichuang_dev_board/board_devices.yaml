  #   config:
  #     max_pins: 3
  #     # IO0=LCD_CS, IO1=PA_EN, IO2=DVP_PWDN
  #     output_io_mask: [0, 1, 2]          # 三个脚都设为输出
  #     output_io_level_mask: [0, 1, 0]    # CS常低=选中 / PA高=使能 / PWDN低=供电
  #     # No output_io_mode_mask: PCA9557 outputs are push-pull only, and the
  #     # board manager treats a present mask as "call set_output_mode", which
  #     # this chip cannot satisfy.
