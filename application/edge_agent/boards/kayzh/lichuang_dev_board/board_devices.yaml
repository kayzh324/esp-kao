  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      esp_st7789_lichuang_custom:
        override_path: "${BOARD_PATH}/components/esp_st7789_lichuang_custom"
        require: public
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: true
      invert_color: true             # ST7789 通常需要反色
      need_reset: false
      x_max: 320
      y_max: 240
      io_spi_config:
        cs_gpio_num: -1              # CS 由定制驱动里的 PCA9557 完成 reset 期间的 CS 转换
        dc_gpio_num: 39              # 实战派 IO39 DC ✅
        spi_mode: 2
        pclk_hz: 80000000            # 原厂使用 80 MHz
        trans_queue_depth: 10         # 原厂使用深度 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: -1           # 实战派 LCD 无独立复位脚（或经 expander）
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        vendor_config: NULL
        flags:
          reset_active_high: false
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight

