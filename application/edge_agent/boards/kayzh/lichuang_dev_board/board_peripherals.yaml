version: 1.0.0
peripherals:

  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 1          # 实战派 IO1 ✅
        scl: 2          # 实战派 IO2 ✅

  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out # std-out, std-in
    config: &i2s0_config
      port: 0  # Explicitly specify I2S port number
      # Clock configuration
      sample_rate_hz: 16000           # Sample rate in Hz
      mclk_multiple: 256              # Multiple of MCLK to sample rate (256 or 384 for 24-bit)

      # Slot configuration
      data_bit_width: 16              # Data bit width (valid data bits per sample)
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO       # Total bits per slot (AUTO or specific value)
      slot_mode: I2S_SLOT_MODE_STEREO               # MONO or STEREO,I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH                  # LEFT, RIGHT, or BOTH slots
      ws_width: 16                    # WS signal width in BCLK ticks

      # GPIO configuration
      pins:
        mclk: 38                       # GPIO number for MCLK
        bclk: 14                      # GPIO number for BCLK
        ws: 13                        # GPIO number for WS
        dout: 45                      # GPIO number for DATA out
        din: 12                       # GPIO number for DATA in

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    # i2s0 work on duplex mode, so reuse i2s_audio_out configuration
    config: *i2s0_config


  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        data0_io_num: 40             # 实战派 IO40 MOSI ✅
        sclk_io_num: 41              # 实战派 IO41 SCK ✅
        max_transfer_sz: 3200        # 320*2*10

  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 42                   # 实战派 IO42 背光 ✅
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 0
      timer_sel: 0
      duty: 0
      freq_hz: 5000
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: true