  #       frequency: 400000





  - name: camera
    type: camera
    sub_type: dvp
    version: default
    config:
      dvp_config:
        reset_io: -1
        pwdn_io: -1            # camera PWDN sits on PCA9557 IO2, driven low in setup_device.c
        vsync_io: 3
        de_io: 46              # HREF
        pclk_io: 7
        xclk_io: 5
        xclk_freq: 20000000    # GC0308 DVP formats require 20 MHz XCLK
        data_width: CAM_CTLR_DATA_WIDTH_8
        data_io:
          data_io_0: 16
          data_io_1: 18
          data_io_2: 8
          data_io_3: 17
          data_io_4: 15
          data_io_5: 6
          data_io_6: 4
          data_io_7: 9
          data_io_8: -1
          data_io_9: -1
          data_io_10: -1
          data_io_11: -1
          data_io_12: -1
          data_io_13: -1
          data_io_14: -1
          data_io_15: -1
    peripherals:
      - name: i2c_master
        frequency: 100000





