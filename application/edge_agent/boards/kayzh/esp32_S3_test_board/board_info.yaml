description: 'ESP32-S3 self-assembled test board (kayzh): 16MB flash, 8MB octal PSRAM.\nThe device inventory below (chips, I2C addresses, occupied GPIOs) is generated from board_devices.yaml - read it there, do not restate it.\nDo NOT blind-scan the I2C bus (lua i2c bus:scan): it probes addresses 1..126 while holding the bus mutex and can stall the sensors; use the generated addresses.\nBacklight is GPIO16 driven as PWM (not part of the display device config); display_lcd params come from board_manager.get_display_lcd_params.\nThe lcd_touch IRQ is wired to GPIO5 but currently polled; its handle is an esp_lcd_touch_handle_t.\nWith an SD card inserted the DATA root is /sdcard, otherwise the flash /fatfs.\nCamera is an external USB UVC device and audio is an external USB UAC dongle; I2S PDM TX is on GPIO15.'
